name: Node 26 compatibility

# Verifies the library builds, type-checks, and passes its tests on Node.js 26.
# Node 26 is not yet GA (it reaches stable ~Oct 2026), so this runs as a
# non-blocking signal: `continue-on-error` keeps a red Node 26 from failing the
# overall check while the runtime is still pre-release. A weekly schedule keeps
# the signal fresh as Node 26 progresses toward release, and workflow_dispatch
# allows on-demand runs. Once Node 26 is GA and stable here, fold 26.x into the
# main `build` matrix in ci.yml and retire this workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node26:
    name: Node 26 compatibility
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check package exports (are-the-types-wrong)
        run: npm run check:exports

      - name: Run tests
        run: npm test

      - name: Check examples compile
        run: npm run test:examples

      - name: Check type assertions (tsd)
        run: npm run test:types

      - name: Check types
        run: npx tsc --noEmit
