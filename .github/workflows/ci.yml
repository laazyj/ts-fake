name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Check package exports (are-the-types-wrong)
        run: npm run check:exports

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Check examples compile
        run: npm run test:examples

      - name: Check type assertions (tsd)
        run: npm run test:types

      - name: Check types
        run: npx tsc --noEmit

  # Verifies the examples (a proxy for consumer code) compile against the
  # floor and ceiling of the `typescript` peer range (>=5.0.0), guarding the
  # compatibility we advertise to consumers rather than only the pinned
  # build-time version exercised by the `build` job. 5.0.2 is the lowest
  # published stable in the range (TypeScript never shipped a 5.0.0/5.0.1
  # stable). The matrix TypeScript is run via npx so it never has to be
  # reconciled into the locked dependency tree.
  type-compat:
    name: TypeScript compatibility (${{ matrix.typescript }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        typescript: ['5.0.2', 'latest']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile examples with TypeScript ${{ matrix.typescript }}
        run: npx --yes --package typescript@${{ matrix.typescript }} tsc --project tsconfig.examples.json

  # Lints the workflow files themselves: invalid syntax, bad expressions,
  # deprecated runners, and shell issues in `run:` blocks (via the bundled
  # shellcheck) — caught before they can silently break CI.
  actionlint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint
        # rhysd/actionlint:1.7.12 pinned by digest (third-party image)
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
