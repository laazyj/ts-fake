name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supersede in-progress runs on a PR; keep pushes to main intact.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Produces the tarball every downstream job consumes. Deliberately minimal:
  # `consumer-smoke` and `type-compat` wait on this job, so anything not
  # needed to package belongs in `static`, which runs alongside them.
  build:
    name: Build and package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Use Node.js (pinned toolchain)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack the publishable tarball
        run: mkdir -p pack && npm pack --pack-destination ./pack

      - name: Upload the tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarball
          path: pack/*.tgz
          if-no-files-found: error
          retention-days: 1

  # Everything whose result cannot vary by Node version. Lint, formatting and
  # the tsc/tsd runs give the same answer on any Node, and the suite exercises
  # `src/` through vite rather than the published bundle — `consumer-smoke`
  # is what covers the artifact per Node version. So this all runs once, on
  # the pinned toolchain. Builds its own `dist` (~1s) rather than waiting on
  # the `build` job, so the two run in parallel.
  static:
    name: Checks and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Use Node.js (pinned toolchain)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Check package exports (are-the-types-wrong)
        run: npm run check:exports

      - name: Check examples compile
        run: npm run test:examples

      - name: Check consumer fixtures compile (node16 / exports map)
        run: npm run test:compat

      - name: Check type assertions (tsd)
        run: npm run test:types

      - name: Check types
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # The only job that runs the published artifact: it installs the packed
  # tarball into a throwaway fixture, so Node itself resolves the `files` list
  # and the `exports` map as a consumer would. This is what backs the
  # `engines: >=20` claim, so this matrix tracks `engines`, not the toolchain.
  consumer-smoke:
    name: Consumer smoke (Node ${{ matrix.node-version }})
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # No `npm ci`: the harness uses only Node builtins and the npm CLI.
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download the packed tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: pack

      - name: Load the package through both export conditions
        run: npm run test:smoke -- pack/*.tgz

  # Verifies consumer-facing compatibility against the floor and ceiling of
  # the `typescript` peer range (>=4.7.0), guarding the compatibility we
  # advertise to consumers rather than only the pinned build-time version
  # exercised by the `build` job. The matrix TypeScript is run via npx so it
  # never has to be reconciled into the locked dependency tree.
  #
  # Two resolution modes are exercised:
  #   * bundler (tsconfig.examples.json) — the modern harness; requires TS
  #     5.0+, so it cannot test the floor. 5.0.2 is the lowest published
  #     stable there (TypeScript never shipped a 5.0.0/5.0.1 stable).
  #   * node16 (tsconfig.compat.json) — compiles consumer fixtures that
  #     import the package by name, resolving the published `exports` map
  #     and its per-condition `types` exactly as a node16/nodenext consumer
  #     would. Stable `exports`-conditioned type resolution landed in TS 4.7,
  #     which is what pins the floor. 4.7.2 is the lowest published stable.
  # The node16 fixtures resolve against `dist`, taken from the `build` job's
  # tarball; the bundler legs compile `examples/` against `src/`. Each leg
  # therefore installs or downloads only what its own tsconfig reads.
  #
  # `7` (the native-port compiler) is pinned rather than left to the floating
  # `latest` leg: `latest` only ever proves the newest major, so a pinned leg
  # is what keeps 7 covered the day 8 ships. Until then the two are knowingly
  # redundant — that overlap is the cost of the insurance, and `latest` stays
  # on as the canary for whatever ships next. 6.x, the toolchain the package
  # is built with, needs no leg here: the `build` job exercises it directly.
  # That toolchain cannot move to 7 yet — typescript-eslint 8.x refuses to
  # load against it — which is why the matrix runs ahead of the devDependency.
  type-compat:
    name: TypeScript compatibility (${{ matrix.label }})
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: '4.7.2 / node16 (floor)'
            typescript: '4.7.2'
            tsconfig: tsconfig.compat.json
          - label: '5.0.2 / bundler'
            typescript: '5.0.2'
            tsconfig: tsconfig.examples.json
          - label: '7.x / node16'
            typescript: '7'
            tsconfig: tsconfig.compat.json
          - label: '7.x / bundler'
            typescript: '7'
            tsconfig: tsconfig.examples.json
          - label: 'latest / bundler'
            typescript: 'latest'
            tsconfig: tsconfig.examples.json
          - label: 'latest / node16'
            typescript: 'latest'
            tsconfig: tsconfig.compat.json

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Use Node.js (pinned toolchain)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # Only the bundler legs need an install: tsconfig.json sets
      # `types: ["node"]`. tsconfig.compat.json sets `types: []` and resolves
      # the package by self-name, so it needs nothing but `dist`.
      - name: Install dependencies
        if: matrix.tsconfig == 'tsconfig.examples.json'
        run: npm ci

      - name: Download the packed tarball
        if: matrix.tsconfig == 'tsconfig.compat.json'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: pack

      - name: Restore dist from the tarball
        if: matrix.tsconfig == 'tsconfig.compat.json'
        run: |
          tar -xzf pack/*.tgz package/dist
          mv package/dist dist
          rm -rf package

      - name: Type-check with TypeScript ${{ matrix.typescript }} (${{ matrix.tsconfig }})
        run: npx --yes --package typescript@${{ matrix.typescript }} tsc --project ${{ matrix.tsconfig }}

  # Lints the workflow files themselves: invalid syntax, bad expressions,
  # deprecated runners, and shell issues in `run:` blocks (via the bundled
  # shellcheck) — caught before they can silently break CI.
  actionlint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run actionlint
        # rhysd/actionlint:1.7.12 pinned by digest (third-party image)
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
