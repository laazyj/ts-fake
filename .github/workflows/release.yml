name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Never restore a cache into the job that publishes.
          package-manager-cache: false
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run prerelease

      # Extract this version's section from CHANGELOG.md (fail before
      # publishing if it is missing) to use as the GitHub Release body.
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {f=1; next} f && /^## \[/ {exit} f {print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "::error::No CHANGELOG section found for v$version"; exit 1; }
          echo "Release notes for v$version:"
          cat release-notes.md

      - name: Publish to npm
        run: npm publish --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
