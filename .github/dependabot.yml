# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing it, so a compromised or
    # yanked version has time to be caught upstream first.
    cooldown:
      default-days: 7
    groups:
      # vitest and its `@vitest/*` siblings pin each other with exact-version
      # peer ranges, so bumped separately neither PR can install (`npm ci`
      # fails ERESOLVE). They must move as one update.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
    # typescript-eslint 8.x does not support TS 7.0 (#79).
    ignore:
      - dependency-name: "typescript"
        versions: ["7.0.x"]

  # Keep the SHA-pinned actions in the workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing it, so a compromised or
    # yanked version has time to be caught upstream first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
